{% extends 'base.html' %}
{% block title %}{{ page_title }} | Jai Malhar{% endblock %}
{% block content %}
<div class="page-header"><div><h1 class="page-title">{{ page_title }}</h1></div><a href="{% url 'materials:list' %}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back</a></div>
<div class="card" style="max-width:600px;"><div class="card-body">
  <form method="post">{% csrf_token %}
    <div class="row g-3">
      <div class="col-12"><label class="form-label">Material Name *</label><input type="text" name="name" class="form-control" value="{{ mat.name|default:'' }}" required></div>
      <div class="col-md-6"><label class="form-label">Category</label><select name="category" class="form-select">{% for val, label in categories %}<option value="{{ val }}" {% if mat.category == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
      <div class="col-md-6"><label class="form-label">Unit</label><select name="unit" class="form-select">{% for val, label in units %}<option value="{{ val }}" {% if mat.unit == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
      {% if not mat %}<div class="col-md-6"><label class="form-label">Opening Stock</label><input type="number" name="current_stock" class="form-control" value="0" min="0" step="0.01"></div>{% endif %}
      <div class="col-md-6"><label class="form-label">Minimum Stock (Alert)</label><input type="number" name="minimum_stock" class="form-control" value="{{ mat.minimum_stock|default:'0' }}" min="0" step="0.01"></div>
      <div class="col-md-6"><label class="form-label">Unit Price (₹)</label><input type="number" name="unit_price" class="form-control" value="{{ mat.unit_price|default:'0' }}" min="0" step="0.01"></div>
      <div class="col-md-6"><label class="form-label">Supplier</label><select name="supplier" class="form-select"><option value="">-- No Supplier --</option>{% for s in suppliers %}<option value="{{ s.pk }}" {% if mat.supplier_id == s.pk %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div>
      <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2">{{ mat.description|default:'' }}</textarea></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Material</button>
      <a href="{% url 'materials:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
