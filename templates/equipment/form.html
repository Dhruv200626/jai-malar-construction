{% extends 'base.html' %}
{% block title %}{{ page_title }} | Jai Malhar{% endblock %}
{% block content %}
<div class="page-header"><div><h1 class="page-title">{{ page_title }}</h1></div><a href="{% url 'equipment:list' %}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back</a></div>
<div class="card" style="max-width:620px;"><div class="card-body">
<form method="post">{% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Equipment Name *</label><input type="text" name="name" class="form-control" value="{{ eq.name|default:'' }}" required></div>
    <div class="col-md-6"><label class="form-label">Category</label><select name="category" class="form-select">{% for val, label in categories %}<option value="{{ val }}" {% if eq.category == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Owner / Vendor</label><input type="text" name="owner_vendor" class="form-control" value="{{ eq.owner_vendor|default:'' }}" placeholder="Owner or rental company"></div>
    <div class="col-md-3"><label class="form-label">Rental Cost (₹)</label><input type="number" name="rental_cost" class="form-control" value="{{ eq.rental_cost|default:'0' }}" min="0" step="0.01"></div>
    <div class="col-md-3"><label class="form-label">Per</label><select name="rental_per" class="form-select"><option value="day" {% if eq.rental_per == 'day' %}selected{% endif %}>Day</option><option value="hour" {% if eq.rental_per == 'hour' %}selected{% endif %}>Hour</option><option value="month" {% if eq.rental_per == 'month' %}selected{% endif %}>Month</option></select></div>
    <div class="col-md-6"><label class="form-label">Project</label><select name="project" class="form-select"><option value="">-- No Project --</option>{% for p in projects %}<option value="{{ p.pk }}" {% if eq.project_id == p.pk %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Status</label><select name="status" class="form-select">{% for val, label in status_choices %}<option value="{{ val }}" {% if eq.status == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Start Date</label><input type="date" name="start_date" class="form-control" value="{{ eq.start_date|date:'Y-m-d'|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">End Date</label><input type="date" name="end_date" class="form-control" value="{{ eq.end_date|date:'Y-m-d'|default:'' }}"></div>
    <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ eq.notes|default:'' }}</textarea></div>
  </div>
  <div style="margin-top:16px;display:flex;gap:8px;">
    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
    <a href="{% url 'equipment:list' %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div></div>
{% endblock %}
